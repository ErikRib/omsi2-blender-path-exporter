name: Build APK

on:
  push:
    branches: [claude/mobile-learning-app-s4fxvr]
    paths:
      - 'kivy_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('kivy_app/buildozer.spec') }}-v2
          restore-keys: buildozer-

      - name: Build APK via Docker (kivy/buildozer image)
        run: |
          docker pull kivy/buildozer:latest
          docker run --rm \
            -v $GITHUB_WORKSPACE/kivy_app:/home/user/hostcwd \
            -v $HOME/.buildozer:/home/user/.buildozer \
            kivy/buildozer:latest \
            android debug

      - name: List generated files
        run: ls -lh $GITHUB_WORKSPACE/kivy_app/bin/ || echo "bin/ not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aprenda-plus-debug
          path: kivy_app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
