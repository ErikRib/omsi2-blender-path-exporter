name: Build APK

on:
  push:
    branches: [claude/mobile-learning-app-s4fxvr]
    paths:
      - 'kivy_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('kivy_app/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer & Cython
        run: pip install buildozer==1.5.0 cython==0.29.33

      - name: Build APK
        working-directory: kivy_app
        run: buildozer android debug 2>&1 | tail -100

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprenda-plus-debug
          path: kivy_app/bin/*.apk
          retention-days: 30
